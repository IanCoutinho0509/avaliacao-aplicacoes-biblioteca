# Arquivo fixo: os agentes não podem alterar.
# A porta é sempre 8000 dentro do contêiner; o orquestrador mapeia cada execução para uma porta do host.
server.port=8000

# Banco MySQL de cada execução. Os valores vêm de variáveis de ambiente definidas pelo orquestrador;
# os padrões servem para rodar à mão na máquina.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:biblioteca}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# Executa src/main/resources/schema.sql a cada inicialização (o agente escreve esse arquivo).
spring.sql.init.mode=always

# JPA: o Hibernate não cria nem altera tabelas (o esquema vem só do schema.sql, que roda antes dele), mas confere ao
# subir se as entidades batem com as tabelas: um mapeamento errado impede a aplicação de subir, com a coluna no erro.
spring.jpa.hibernate.ddl-auto=validate
# Sem sessão aberta na camada web: o acesso ao banco fica nos services, dentro das transações.
spring.jpa.open-in-view=false

# Respostas de erro com a mensagem e os erros de validação, para o front poder mostrar ao usuário.
server.error.include-message=always
server.error.include-binding-errors=always
